plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    namespace 'com.sorokinuladzimir.homebarassistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.sorokinuladzimir.homebarassistant"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 4
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        ignoreWarnings true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // --- Jetpack Compose ---
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.core.ktx
    debugImplementation libs.androidx.compose.ui.tooling

    // --- Dependency Injection ---
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // --- AndroidX / Google (legacy UI, до этапов 5-7) ---
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.lifecycle.extensions

    // --- Room ---
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // --- Coroutines / lifecycle ktx ---
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    // --- Networking / serialization ---
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.gson

    // --- Third-party (legacy, будут удалены на этапах 5-7) ---
    implementation libs.cicerone
    implementation libs.ahbottomnavigation
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    implementation(libs.spectrum) {
        exclude module: 'preference-v7'
    }
    implementation libs.rxjava
    implementation libs.materialscrollbar
    implementation(libs.materialrangebar) {
        exclude module: 'support-compat'
    }
}
