plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sorokinuladzimir.homebarassistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.sorokinuladzimir.homebarassistant"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 4
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        ignoreWarnings true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    implementation 'com.aurelhubert:ahbottomnavigation:2.2.0'
    implementation 'com.github.terrakok:Cicerone:2.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation('com.thebluealliance:spectrum:0.7.1') {
        exclude module: 'preference-v7'
    }

    implementation "io.reactivex.rxjava2:rxjava:2.2.21"

    implementation 'com.github.turing-tech:MaterialScrollBar:12.5.1'
    implementation('com.appyvet:materialrangebar:1.4.6') {
        exclude module: 'support-compat'
    }
}
