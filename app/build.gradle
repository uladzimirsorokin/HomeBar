plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def cocktailDbApiKey = localProperties.getProperty('COCKTAILDB_API_KEY', '1')
def cocktailDbRoot = localProperties.getProperty('COCKTAILDB_ROOT', 'https://www.thecocktaildb.com/api/json/v1/')
def aiBaseUrl = localProperties.getProperty('AI_BASE_URL', 'http://10.0.2.2:11434/v1/')
def aiModel = localProperties.getProperty('AI_MODEL', 'gpt-oss:20b')
def aiApiKey = localProperties.getProperty('AI_API_KEY', '')

android {
    namespace 'com.sorokinuladzimir.homebarassistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.sorokinuladzimir.homebarassistant"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 4
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "COCKTAILDB_API_KEY", "\"${cocktailDbApiKey}\""
        buildConfigField "String", "COCKTAILDB_ROOT", "\"${cocktailDbRoot}\""
        buildConfigField "String", "AI_BASE_URL", "\"${aiBaseUrl}\""
        buildConfigField "String", "AI_MODEL", "\"${aiModel}\""
        buildConfigField "String", "AI_API_KEY", "\"${aiApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        ignoreWarnings true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // --- Jetpack Compose ---
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.core
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.core.ktx
    implementation libs.androidx.datastore.preferences
    implementation libs.coil.compose
    debugImplementation libs.androidx.compose.ui.tooling

    // --- Dependency Injection ---
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // --- Room ---
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // --- Coroutines / lifecycle ktx ---
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    // --- Networking / serialization ---
    implementation libs.retrofit
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.retrofit.kotlinx.serialization
    implementation libs.kotlinx.serialization.json

    // --- Unit tests ---
    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.turbine
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.arch.core.testing

    // --- Instrumented / Compose UI tests ---
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
}
